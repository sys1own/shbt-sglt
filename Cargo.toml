# shbt-sglt workspace manifest — Synthetic Gravitational Lensing Telescope
# digital-twin / HIL co-simulation suite (sglt.txt §1, up1.txt v2.0 §1).

[workspace]
resolver = "2"
members = [
    # v1.0 crates (sglt.txt)
    "crates/sglt-core-metric",
    "crates/sglt-flight-gnc",
    "crates/sglt-transducer-fea",
    "crates/sglt-lanr-power",
    "crates/sglt-hil-microkernel",
    "crates/sglt-astro-reconstruction",
    # v2.0 crates (up1.txt)
    "crates/sglt-optical-raytrace",
    "crates/sglt-orbital-flight",
    "crates/sglt-cryo-thermal",
    "crates/sglt-autonomy-comm",
    "crates/sglt-hil-fault-injection",
    "crates/sglt-target-observatory",
    # v3.0 crates (up2.txt)
    "crates/sglt-neural-optics",
    "crates/sglt-hardware-dma",
    "crates/sglt-quantum-decoherence",
    "crates/sglt-swarm-dynamics",
    # unified expansion crates
    "crates/sglt-squeezed-metrology",
    "crates/sglt-diamond-transducer",
    "crates/sglt-2pn-coronal-optics",
    "crates/sglt-metamaterial-radiation",
    "crates/sglt-gpu-physics",
    "crates/sglt-uncertainty-uq",
    "crates/sglt-tqec-dark-ledger",
    "crates/sglt-webgpu-vis",
    # non-local sensor-mesh crates (sglt1.txt)
    "crates/sglt-nonlocal-telemetry",
    "crates/sglt-causal-point-metrology",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["SGLT Core Systems Engineering Team"]
license = "MIT"

[workspace.dependencies]
# v1.0
rug = { version = "=1.24.0", features = ["float"] }
cc = "1"
# v2.0 (up1.txt §1 workspace dependency pinning)
nalgebra = "0.32"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.8"
libc = "0.2"
thiserror = "1.0"
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }
fitsio = "0.21"
hdf5 = "0.8"
cspice-sys = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
